name: Credly Badge CSV

on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: credly-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate Credly CSV
        run: node generate-credly-csv.js
        env:
          GH_TOKEN: ${{ secrets.BADGE_READ_TOKEN }}

      - name: Upload Credly CSV artifact
        uses: actions/upload-artifact@v5
        with:
          name: credly-csv
          path: credly-*.csv
          if-no-files-found: ignore

      - name: Commit and push updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issued-badges.json
          if git diff --cached --quiet; then
            echo "No changes to issued-badges.json"
            exit 0
          fi
          git commit -m "Update issued badges $(date -u +%Y-%m)"
          git push
